name: Windows tests

on:
  push:
  pull_request:

jobs:
  compatibility:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path . -Filter '*.ps1' -File -Recurse |
            ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
              $errors += $parseErrors
            }
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
      - name: Test JavaFX/JDK compatibility table
        shell: pwsh
        run: ./tests/test-version-mapping.ps1
      - name: Test multi-IDE JavaFX setup
        shell: pwsh
        run: ./tests/test-ide-setup.ps1
      - name: Install SDK and smoke-test commands
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/common.ps1
          $jdk = Get-CurrentJdk
          $expected = Get-CompatibleJavaFxRelease -JdkMajor $jdk.Major

          ./install.ps1
          if ($LASTEXITCODE -ne 0) {
            throw 'JavaFX Hotspot installer failed.'
          }
          if (-not $env:PATH_TO_FX.EndsWith("javafx-$($expected.version)-windows-x64\lib")) {
            throw "Installer selected an unexpected SDK: $env:PATH_TO_FX"
          }

          $project = Join-Path $env:RUNNER_TEMP ("javafx-hotspot smoke " + [guid]::NewGuid().ToString('N'))
          $sourceDirectory = Join-Path $project 'src\smoke'
          New-Item -ItemType Directory -Path $sourceDirectory -Force | Out-Null
          @'
          package smoke;
          import javafx.scene.paint.Color;
          public class Smoke {
              public static void main(String[] args) {
                  if (args.length != 1 || !args[0].equals("-Xmx-is-app-argument")) {
                      throw new IllegalStateException("Application arguments were not forwarded.");
                  }
                  var fxml = Smoke.class.getResource("/smoke/main.fxml");
                  var css = Smoke.class.getResource("/smoke/app.css");
                  if (fxml == null || css == null) {
                      throw new IllegalStateException("FXML or CSS resource was not copied.");
                  }
                  try {
                      var root = new javafx.fxml.FXMLLoader(fxml).load();
                      if (!(root instanceof javafx.scene.layout.Pane)) {
                          throw new IllegalStateException("Unexpected FXML root.");
                      }
                  } catch (java.io.IOException exception) {
                      throw new RuntimeException("FXML resource could not be loaded.", exception);
                  }
                  System.out.println(Helper.message() + " " + Color.RED);
              }
          }
          '@ | Set-Content -LiteralPath (Join-Path $sourceDirectory 'Smoke.java')
          @'
          package smoke;
          final class Helper {
              static String message() { return "JavaFX Hotspot smoke test passed"; }
          }
          '@ | Set-Content -LiteralPath (Join-Path $sourceDirectory 'Helper.java')
          $resourceDirectory = Join-Path $project 'src\main\resources\smoke'
          New-Item -ItemType Directory -Path $resourceDirectory -Force | Out-Null
          @'
          <?xml version="1.0" encoding="UTF-8"?>
          <?import javafx.scene.layout.Pane?>
          <Pane xmlns:fx="http://javafx.com/fxml/1" />
          '@ | Set-Content -LiteralPath (Join-Path $resourceDirectory 'main.fxml')
          '.root { -fx-background-color: #202020; }' |
            Set-Content -LiteralPath (Join-Path $resourceDirectory 'app.css')

          Push-Location $project
          try {
            $bin = Join-Path $env:LOCALAPPDATA 'JavaFXHotspot\bin'
            & (Join-Path $bin 'javafxc.cmd') Smoke.java Helper.java
            if ($LASTEXITCODE -ne 0) {
              throw 'javafxc failed to compile the packaged smoke test.'
            }
            $output = & (Join-Path $bin 'javafx.cmd') Smoke -Xmx-is-app-argument
            if ($LASTEXITCODE -ne 0 -or ($output -join "`n") -notmatch 'JavaFX Hotspot smoke test passed 0xff0000ff') {
              throw "javafx failed to run the packaged smoke test. Output: $($output -join ' ')"
            }
          } finally {
            Pop-Location
            Remove-Item -LiteralPath $project -Recurse -Force
          }
